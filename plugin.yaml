name: patch-sentinel
version: 0.1.1
manifest_version: 2
description: >
  Answers "are we patched?" with evidence, for whatever the host actually runs — and says when it
  could not look instead of reporting a clean. The adapter is chosen from the host's own
  /etc/os-release (apt, dnf, pacman, zypper, apk; any other OS answers "unsupported" with its name
  rather than a green). It reads: every pending package update, deliberately not filtered to
  -security, with the exact fixed version from that family's advisory source (Ubuntu USN, Bodhi for
  Fedora, OSV per release for Debian/Alpine/RHEL, Arch's tracker, SUSE's OVAL); the running kernel
  against the newest installed and installable, because a kernel patch counts only when it is
  RUNNING; container image tags against their registry digests, anonymously; the language stack —
  npm, pip (global and every virtualenv), PHP, Ruby, Rust, .NET, Maven, Go, Dart, jars on disk and
  lockfile pins — against OSV; the installed files against their package checksums, the preload hook
  and the listening sockets against a recorded baseline; and a CycloneDX SBOM export. The scan is
  read-only: it installs nothing, reboots nothing. Every check has three outcomes — clean, finding,
  could-not-look — and an unreachable host, an unimplemented distro or a rate-limited registry is
  reported as unknown with its reason. cve_rescan reads every surface of one device in the order the
  pane draws them; cve_apply is the only tool that changes a machine and refuses unless the operator
  types the host name, sudo works without a prompt there, and dry_run is explicitly false. Known
  blind spots, stated in every coverage answer: CVEs inside image layers, and dependencies without a
  lockfile.
license: MIT
author: Kevin L. (AITurn)
homepage: https://github.com/thebangarang/Patch-Sentinel
tags: [security, patching, ubuntu, linux, kernel, containers, homelab, auditing]
requires_hermes: ">=0.19"
provides_tools:
  - cve_scan
  - cve_plan
  - cve_explain
  - cve_coverage
  - cve_libraries
  - cve_image
  - cve_sbom
  - cve_apply
  - cve_ack
  - cve_integrity
  # one control for the whole posture: packages, language stack, integrity, then the commands
  - cve_rescan
# every real cve_apply escalates to Hermes' human approval gate; the typed host label inside the
# tool stays as a second guard
provides_hooks:
  - pre_tool_call
config_schema:
  hosts:
    type: str
    default: ""
    label: Hosts to scan
    description: >
      Comma-separated `label=ssh-target` pairs, e.g. `beelink=local,vps=webasix`. `local` (or an
      empty target) is the machine Hermes runs on, which is always included. Remote hosts are
      reached over SSH with your own agent key; the plugin stores no credential for them. Empty
      means this machine only.
  release:
    type: str
    default: resolute
    label: Ubuntu release codename
    description: >
      The codename used when reading the advisory feed (resolute = 26.04, noble = 24.04). It is
      overridden automatically by the codename the local host reports in /etc/os-release, so this
      value only matters for a host that cannot be read.
  usn_limit:
    type: int
    default: 20
    label: Advisories to fetch
    description: >
      How many recent security notices to read per scan (1–20; the feed refuses 25 and above with
      HTTP 422). Higher means a longer trail for attribution, not a better verdict.
  timeout:
    type: int
    default: 180
    label: Host timeout (seconds)
    description: >
      How long one host's probe may take before it is reported as unreadable. A timeout is
      reported as unknown with its reason, never as clean.
  data_dir:
    type: str
    default: ""
    label: Data directory
    description: >
      Absolute path where the last scan and the receipts are kept, mode 700. Empty means the
      plugin's own directory under $HERMES_HOME. Nothing here leaves the machine.
