name: patch-sentinel
version: 0.1.0
manifest_version: 2
description: >
  Answers "are we patched?" with evidence for whatever the machine actually runs, and says when it
  could not look instead of reporting a clean. Chooses its package-manager adapter from the host's
  own /etc/os-release (apt for Ubuntu/Debian and relatives, dnf for Fedora/RHEL/Rocky/Alma/CentOS/
  Amazon; every other OS answers "unsupported" with its name rather than a green), and measures
  three surfaces: the running kernel against the newest installed and the newest installable (a
  kernel patch counts only when it is RUNNING); every pending package update, deliberately not
  filtered to -security, with the advisory that names that exact version where a feed covers it;
  and the container images whose tags no longer resolve to the digest you run. A fifth tool checks
  the language stack (npm's global tree, the pip environment on PATH, and the same shape for other
  ecosystems) against the OSV advisory database, returning each vulnerable package with its fixed
  versions. Read-only in the scan: it installs nothing, reboots nothing. Every check has three
  outcomes — clean, finding, could-not-look — and an unreachable host, an unimplemented distro or a
  rate-limited registry is reported as unknown with its reason, never as patched. A sixth tool,
  cve_apply, can apply the plan; it is the only one that changes a machine and it refuses unless the
  operator types the host name, the user can sudo without a prompt there, and dry_run is explicitly
  false — staging first, re-measuring afterwards, and writing a receipt. Known blind spots, stated in
  every coverage answer: CVEs inside image layers, and language dependencies outside the global
  trees.
license: MIT
author: Kevin L. (AITurn)
homepage: https://github.com/thebangarang/Patch-Sentinel
tags: [security, patching, ubuntu, linux, kernel, containers, homelab, auditing]
requires_hermes: ">=0.19"
provides_tools:
  - cve_scan
  - cve_plan
  - cve_explain
  - cve_coverage
  - cve_libraries
  - cve_apply
provides_hooks: []
config_schema:
  hosts:
    type: str
    default: ""
    label: Hosts to scan
    description: >
      Comma-separated `label=ssh-target` pairs, e.g. `beelink=local,vps=webasix`. `local` (or an
      empty target) is the machine Hermes runs on, which is always included. Remote hosts are
      reached over SSH with your own agent key; the plugin stores no credential for them. Empty
      means this machine only.
  release:
    type: str
    default: resolute
    label: Ubuntu release codename
    description: >
      The codename used when reading the advisory feed (resolute = 26.04, noble = 24.04). It is
      overridden automatically by the codename the local host reports in /etc/os-release, so this
      value only matters for a host that cannot be read.
  usn_limit:
    type: int
    default: 20
    label: Advisories to fetch
    description: >
      How many recent security notices to read per scan (1–20; the feed refuses 25 and above with
      HTTP 422). Higher means a longer trail for attribution, not a better verdict.
  timeout:
    type: int
    default: 180
    label: Host timeout (seconds)
    description: >
      How long one host's probe may take before it is reported as unreadable. A timeout is
      reported as unknown with its reason, never as clean.
  data_dir:
    type: str
    default: ""
    label: Data directory
    description: >
      Absolute path where the last scan and the receipts are kept, mode 700. Empty means the
      plugin's own directory under $HERMES_HOME. Nothing here leaves the machine.
