name: patch-sentinel
repo: https://github.com/thebangarang/Patch-Sentinel
sha: "5ecc7178652c10f96ee0caa3966d0dc897c31e4e"
subdir: ""
description: >
  Answers "are we patched?" with evidence, for whatever the host runs — an adapter chosen from the
  host's own /etc/os-release (apt, dnf, pacman, zypper, apk), the running kernel against the newest
  installed and installable, whatever advisory names the fixed version per release (Ubuntu notices,
  OSV per release, Bodhi, Arch's tracker, SUSE's OVAL), container image digests, the language stack
  across nine ecosystems through OSV, package checksums and sockets against a recorded baseline, and
  a CycloneDX SBOM. Every check has three outcomes, so an unreachable host, an unimplemented distro
  or a rate-limited registry reads as unknown rather than clean. The pane reads one device at a time
  and hands over the exact commands; a gated cve_apply tool stages, applies, re-measures and writes a
  receipt for an agent explicitly asked to patch.
maintainer: thebangarang
tier: community
category: automation
requires_hermes: ">=0.19"
