# The catalogue entry — the file that goes into NousResearch/hermes-agent as
# `plugin-catalog/patch-sentinel.yaml`. Copy everything below this comment block.
#
# The SHA must be a full 40-hex commit from THIS repository, and must point at a commit whose tree is
# clean and contains everything the entry claims. A commit cannot contain its own hash, so the pin
# points at the reviewed tree and the pinning commit follows it — say so in the PR body.
#
# The `image` URL is pinned to that same SHA, so the banner cannot change under the reviewer.
#
# Before opening the PR, re-run (all green on the pinned commit):
#   python3 -m unittest discover -s tests -t .
#   ./scripts/pane_check.sh
#   hermes plugins validate .
#   hermes plugins doctor . --ci
name: patch-sentinel
repo: https://github.com/thebangarang/Patch-Sentinel
sha: "PIN_ME"
subdir: ""
description: >-
  Answers "are we patched?" with evidence, for whatever the host runs — an adapter chosen from the
  host's own /etc/os-release (apt, dnf, pacman, zypper, apk), the running kernel against the newest
  installed and installable, whatever advisory names the fixed version per release (Ubuntu notices,
  OSV per release, Bodhi, Arch's tracker, SUSE's OVAL), container image digests, nine language
  ecosystems through OSV plus lockfile pins, package checksums and listening sockets against a
  recorded baseline, and a CycloneDX SBOM. Every check has three outcomes — clean, finding,
  could-not-look — so an unreachable host, an unimplemented distro or a rate-limited registry reads
  as unknown rather than clean. The pane reads one device at a time and hands over the exact commands
  per device; a gated cve_apply tool stages, applies, re-measures and writes a receipt for an agent
  explicitly asked to patch. Linux only: any other OS answers "unsupported" with its name.
maintainer: thebangarang
tier: community
category: automation
requires_hermes: ">=0.19"
docs_url: "https://github.com/thebangarang/Patch-Sentinel#readme"
version: "0.1.0"
title: "Patch Sentinel"
image: "https://raw.githubusercontent.com/thebangarang/Patch-Sentinel/PIN_ME/docs/banner.png"
platforms: [linux]
capabilities:
  provides_tools:
    - cve_scan
    - cve_plan
    - cve_explain
    - cve_coverage
    - cve_libraries
    - cve_image
    - cve_sbom
    - cve_apply
    - cve_ack
    - cve_integrity
    - cve_rescan
  provides_hooks: []
  provides_middleware: []
  requires_env: []
